<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Brume</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #000;
        color: #ffe49d;
        font-family: ui-serif, Georgia, "Times New Roman", serif;
        display: flex;
        align-items: center;
        justify-content: center;
        letter-spacing: 0.18em;
        font-size: 1.4rem;
      }
      .wrap {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 22px;
      }
      .spin {
        width: 32px;
        height: 32px;
        border: 2px solid rgba(255, 228, 157, 0.25);
        border-top-color: #ffe49d;
        border-radius: 50%;
        animation: r 0.9s linear infinite;
      }
      .label {
        font-size: 0.95rem;
        letter-spacing: 0.22em;
      }
      @keyframes r {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <span class="spin"></span>
      <span class="label">Opening Brume 24/7</span>
    </div>
  </body>
</html>
